{% extends 'base.html' %}

{% block title %}FAQ - E-comXpress{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="text-center mb-5">
        <h2>Frequently Asked Questions</h2>
        <p class="text-muted">Find answers to common questions about our services</p>
    </div>
    <div class="accordion" id="faqAccordion">
        {% for faq in faqs %}
        <div class="accordion-item">
            <h2 class="accordion-header" id="heading{{ loop.index }}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ loop.index }}" aria-expanded="false" aria-controls="collapse{{ loop.index }}">
                    {{ faq.category }} — {{ faq.question }}
                </button>
            </h2>
            <div id="collapse{{ loop.index }}" class="accordion-collapse collapse" aria-labelledby="heading{{ loop.index }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body" style="white-space: pre-line;">
                    {{ faq.answer }}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
