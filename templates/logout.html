{% extends 'base.html' %}
{% block title %}Logout - E-comXpress{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-sm mx-auto text-center p-5" style="max-width: 500px;">
        <i class="bi bi-exclamation-triangle-fill text-danger mb-3" style="font-size: 4rem;"></i>
        <h3 class="mb-3">Are you sure you want to logout?</h3>
        <p class="text-muted mb-4">You will be securely logged out of your account and will need to log in again to access your personal details and order history.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <form method="POST" action="{{ url_for('logout_confirm') }}" class="m-0">
                <button type="submit" class="btn btn-danger px-4">Yes, Logout</button>
            </form>
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
